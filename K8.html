
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8 - Tính chỉ số BMI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f85;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef6ff;
            border-radius: 8px;
            text-align: center;
            line-height: 1.8;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>K8 - Tính chỉ số BMI</h2>

        <label for="weight">Cân nặng (kg):</label>
        <input type="number" id="weight"
               placeholder="Ví dụ: 60" min="0.1" step="any">

        <label for="height">Chiều cao (m):</label>
        <input type="number" id="height"
               placeholder="Ví dụ: 1.7" min="0.1" step="any">

        <button onclick="calculateBMI()">Tính BMI</button>

        <div id="result">
            Nhập cân nặng và chiều cao để tính BMI.
        </div>

        <a href="42.html">Quay về trang chủ</a>
    </div>

    <script>
        function calculateBMI() {
            const weight = parseFloat(
                document.getElementById("weight").value
            );

            const height = parseFloat(
                document.getElementById("height").value
            );

            const result = document.getElementById("result");

            // Kiểm tra dữ liệu đầu vào
            if (
                !Number.isFinite(weight) ||
                !Number.isFinite(height) ||
                weight <= 0 ||
                height <= 0
            ) {
                result.textContent =
                    "Vui lòng nhập cân nặng và chiều cao hợp lệ!";
                return;
            }

            // Tính chỉ số BMI
            const bmi = weight / (height * height);

            // Phân loại BMI
            let classification;

            if (bmi < 18.5) {
                classification = "Thiếu cân";
            } else if (bmi < 25) {
                classification = "Bình thường";
            } else {
                classification = "Thừa cân";
            }

            // Hiển thị kết quả
            result.innerHTML =
                "Chỉ số BMI: <strong>" + bmi.toFixed(2) +
                "</strong><br>" +
                "Phân loại: <strong>" + classification +
                "</strong>";
        }
    </script>

</body>
</html>
