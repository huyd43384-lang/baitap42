
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K6 - Xử Lý Sự Kiện Bàn Phím</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7fb;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: 350px;
            margin-top: 20px;
            background-color: #e8f3ff;
            border: 2px solid #1769aa;
            border-radius: 8px;
            overflow: hidden;
        }

        #box {
            position: absolute;
            width: 80px;
            height: 60px;
            left: 50%;
            top: 145px;
            transform: translateX(-50%);
            background-color: #1769aa;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: top 0.15s ease;
        }

        button {
            margin: 5px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #1769aa;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d4f85;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>K6 - Xử Lý Sự Kiện Bàn Phím</h2>

        <p>Nhấn phím ↑ để di chuyển lên, ↓ để di chuyển xuống.</p>

        <div id="gameArea">
            <div id="box">Di chuyển</div>
        </div>

        <p id="status">Vị trí: 145px</p>

        <button onclick="moveUp()">Di chuyển lên ↑</button>
        <button onclick="moveDown()">Di chuyển xuống ↓</button>

        <br>
        <a href="42.html">Quay về trang chủ</a>
    </div>

    <script>
        const box = document.getElementById("box");
        const gameArea = document.getElementById("gameArea");
        const status = document.getElementById("status");

        let position = 145;
        const step = 20;

        function updatePosition() {
            box.style.top = position + "px";
            status.textContent = "Vị trí: " + position + "px";
        }

        function moveUp() {
            if (position > 0) {
                position = Math.max(0, position - step);
                updatePosition();
            }
        }

        function moveDown() {
            const maxPosition = gameArea.clientHeight - box.offsetHeight;

            if (position < maxPosition) {
                position = Math.min(maxPosition, position + step);
                updatePosition();
            }
        }

        // Lắng nghe sự kiện bàn phím
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowUp") {
                event.preventDefault();
                moveUp();
            } else if (event.key === "ArrowDown") {
                event.preventDefault();
                moveDown();
            }
        });
    </script>

</body>
</html>
